# Welcome to Jekyll!
#
# This config file is meant for settings that affect your entire site, values
# which you are expected to set up once and rarely need to edit after that.
# For technical reasons, this file is *NOT* reloaded automatically when you use
# `jekyll serve`. If you change this file, please restart the server process.

# Site Settings
title                    : "Jeff Ge"
description              : "AI Specialist at HKBN. Sole owner of TenderAI, a production GraphRAG tender platform used daily by 80+ colleagues."
url                      : "https://chloceg.github.io"
baseurl                  : ""
repository               : "chloceg/chloceg.github.io"

# Analytics
# visitor_count shows unique visitors + page views in the sidebar (Vercount, no signup).
visitor_count            : true
google_analytics_id      :  # e.g. G-XXXXXXXXXX from https://analytics.google.com/
clarity_id               :  # optional Microsoft Clarity project ID
# Free IP log, no server of your own: https://statcounter.com (Basic plan).
# After signup, Config → Reinstall Code → copy Project ID and Security Code.
# View IPs in Statcounter → Visitor Activity. Leave empty to keep this off.
statcounter_project      :
statcounter_security     :
# Optional private log (Cloudflare Worker) if you do not want a third party
# to store IPs. See visitor-log/README.md. Do not paste IPs into this repo.
visitor_log_url          :

# SEO Related
google_site_verification :  # get google_site_verification from https://search.google.com/search-console/about
bing_site_verification   :  # get bing_site_verification from https://www.bing.com/webmasters/about
baidu_site_verification  :  # get baidu_site_verification from https://ziyuan.baidu.com/login/index?u=/site/index

# Site Author
author:
  name             : "Jeff Ge"
  avatar           : "images/android-chrome-512x512.png"
  bio              : "AI Specialist"
  email            : "njycgqw@icloud.com"
  phone            : "+852 5335 2638"
  location         : "Hong Kong"
  employer         : "HKBN"
  uri              :
  github           : "chloceg"
  cv               : "files/Jeff-Ge-CV.pdf"
  linkedin         : # e.g., "linkedin username"
  twitter          :
  facebook         :
  instagram        :
  youtube          :
  weibo            :


# Reading Files
include:
  - .htaccess
  - _pages
  - files
exclude:
  - "*.sublime-project"
  - "*.sublime-workspace"
  - .asset-cache
  - .bundle
  - .jekyll-assets-cache
  - .sass-cache
  - CHANGELOG
  - Capfile
  - Gemfile
  - Gruntfile.js
  - LICENSE
  - README
  - Rakefile
  - assets/js/_main.js
  - assets/js/plugins
  - assets/js/vendor
  - config
  - gulpfile.js
  - log
  - node_modules
  - package.json
  - tmp
  - vendor
  - scripts
  - run_server.sh
  - docs
  - visitor-log
keep_files:
  - .git
  - .svn
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"


# Conversion
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false


# Markdown Processing
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false

# Defaults
defaults:
  # _pages
  - scope:
      path: ""
      type: pages
    values:
      layout: default
      author_profile: true


# Sass/SCSS
sass:
  sass_dir: _sass
  style: compressed # http://sass-lang.com/documentation/file.SASS_REFERENCE.html#output_style


# Outputting
permalink: /:categories/:title/
timezone: Asia/Hong_Kong # http://en.wikipedia.org/wiki/List_of_tz_database_time_zones


# Plugins
# Two removals here:
#   whitelist:      the deprecated Jekyll 3 alias for `plugins:`. It also listed
#                   jemoji, which this site never enabled.
#   jekyll-paginate: dropped along with the `compress_html:` block below it (that
#                   one was dead too - no {% compress_html %} tag exists in any
#                   template). Adding it back needs a pagination gem; see Gemfile.
plugins:
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jekyll-redirect-from
