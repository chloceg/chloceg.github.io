{% if page.analytics != false %}

{% if site.visitor_count %}
<script defer src="https://events.vercount.one/js"></script>
{% endif %}

{% if site.google_analytics_id %}
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id={{ site.google_analytics_id }}"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', '{{ site.google_analytics_id }}');
</script>
{% endif %}

{% if site.clarity_id %}
<script>
  (function(c,l,a,r,i,t,y){
    c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
    t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
    y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
  })(window, document, "clarity", "script", "{{ site.clarity_id }}");
</script>
{% endif %}

{% if site.statcounter_project and site.statcounter_security %}
<script>
  var sc_project = {{ site.statcounter_project | plus: 0 }};
  var sc_invisible = 1;
  var sc_security = {{ site.statcounter_security | jsonify }};
  var sc_https = 1;
</script>
<script src="https://www.statcounter.com/counter/counter.js" async></script>
<noscript>
  <div class="statcounter">
    <img class="statcounter"
         src="https://c.statcounter.com/{{ site.statcounter_project | plus: 0 }}/0/{{ site.statcounter_security | uri_escape }}/1/"
         alt=""
         referrerpolicy="no-referrer-when-downgrade">
  </div>
</noscript>
{% endif %}

{% endif %}
